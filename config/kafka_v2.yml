KafkaV2: # 只针对 Kafka  操作有效
  Addr: "192.168.17.251:9092"
  Version: "2.8.1"
  Producer:
    Balancer: "hash"
    WriteTimeout: 10
    BatchSize: 1000
    BatchTimeout: 1
    RequiredAcks: 0
    Async: false
    PoolSize: 30
  Consumer:
    GroupId: "armour"
    CommitInterval: 3
    StartOffset: -2 #-1 从最新开始， -2 从头开始
  TopicList:
    TopicComm:
      Name: "common"
      Partition: 3
      ReplicationFactor: 1
    TopicProcess:
      Name: "process"
      Partition: 3
      ReplicationFactor: 1
    TopicThreaten:
      Name: "threaten"
      Partition: 3
      ReplicationFactor: 1
    TopicAlarm:
      Name: "alarm"
      Partition: 3
      ReplicationFactor: 1
    TopicSyslog:
      Name: "syslog"
      Partition: 5
      ReplicationFactor: 1