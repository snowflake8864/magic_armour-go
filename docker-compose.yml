version: '3.0'
services:
  redis:
    image: redis:6.2.6
    restart: always
    privileged: true
    hostname: redis
    container_name: redis
    ports:
      - 6379:6379
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /data/redis/conf/redis.conf:/usr/local/redis/conf/redis.conf
      - /data/redis/data:/data
    command: "redis-server /usr/local/redis/conf/redis.conf --appendonly yes"
    networks:
      my_custom_bridge:
        ipv4_address: 172.23.0.10
  kafka:
    image: bitnami/kafka:latest
    restart: always
    privileged: true
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - /data/kafka:/bitnami/kafka:rw
    environment:
      - TZ=Asia/Shanghai
      - BITNAMI_DEBUG=yes
      # 启用KRaft模式必须设置下面三个属性
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # broker id
      - KAFKA_BROKER_ID=1
      # listener的各种配置
      - KAFKA_CFG_LISTENERS=CONTROLLER://:9094,BROKER://:9092,EXTERNAL://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT
      # 注意EXTERNAL配置的是当前Docker所在的主机地址,BROKER可以使用Docker内部的网络地址即可
      - KAFKA_CFG_ADVERTISED_LISTENERS=BROKER://172.23.0.20:9092,EXTERNAL://127.0.0.1:9093
      # 内部各个broker之间通信用的listener
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=BROKER
      # 用来进行选举的Controller服务器，如果有多个Controller则都需要写上，这里本机
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9094
      - ALLOW_PLAINTEXT_LISTENER=yes
    networks:
      my_custom_bridge:
        ipv4_address: 172.23.0.20
  kafka-ui:
    container_name: kafka-ui
    restart: always
    privileged: true
    image: provectuslabs/kafka-ui:latest
    ports:
      - "9095:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-stand-alone
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
      SERVER_SERVLET_CONTEXT_PATH: /kafkaui
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: "veda"
      SPRING_SECURITY_USER_PASSWORD: "veda*2023NB"
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      my_custom_bridge:
        ipv4_address: 172.23.0.21
  doris-fe:
    image: apache-doris:2.1.4-fe
    restart: always
    privileged: true
    hostname: doris-fe
    container_name: doris-fe
    ports:
      - 8030:8030
      - 9030:9030
    environment:
      - TZ=Asia/Shanghai
      - FE_SERVERS=fe1:172.23.0.30:9010
      - FE_ID=1
    volumes:
      - /data/doris/fe/doris-meta/:/opt/apache-doris/fe/doris-meta/
      - /data/doris/fe/log/:/opt/apache-doris/fe/log/
      - /etc/localtime:/etc/localtime:ro # 让容器的时钟与宿主机时钟同步，避免时间的问题，ro是read only的意思，就是只读。
    networks:
      my_custom_bridge:
        ipv4_address: 172.23.0.30
  doris-be:
    image: apache-doris:2.1.4-be
    restart: always
    privileged: true
    hostname: doris-be
    container_name: doris-be
    ports:
      - 8040:8040
      - 9050:9050
    environment:
      - TZ=Asia/Shanghai
      - FE_SERVERS=fe1:172.23.0.30:9010
      - BE_ADDR=172.23.0.32:9050
    volumes:
      - /data/doris/be/script/:/docker-entrypoint-initdb.d/
      - /data/doris/be/storage/:/opt/apache-doris/be/storage/
      - /data/doris/be/log:/opt/apache-doris/be/log/
      - /etc/localtime:/etc/localtime:ro # 让容器的时钟与宿主机时钟同步，避免时间的问题，ro是read only的意思，就是只读。
    depends_on:
      - doris-fe
    networks:
      my_custom_bridge:
        ipv4_address: 172.23.0.32
  mysql8:
    image: mysql:8.0.36
    restart: always
    privileged: true
    hostname: mysql8
    container_name: mysql8
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=veda*2023NB
      - MYSQL_ROOT_HOST=%
    volumes:
      - /data/mysql8/data:/var/lib/mysql
      - /data/mysql8/run:/var/run/mysqld
      - /etc/localtime:/etc/localtime:ro # 让容器的时钟与宿主机时钟同步，避免时间的问题，ro是read only的意思，就是只读。
    networks:
      my_custom_bridge:
        ipv4_address: 172.23.0.33
networks:
  my_custom_bridge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
          gateway: 172.23.0.1
